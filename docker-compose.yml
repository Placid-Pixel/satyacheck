version: '3.8'

services:
  satyacheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: satyacheck:latest
    container_name: satyacheck_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - FERNET_OLD_KEYS=${FERNET_OLD_KEYS:-}
      - DATABASE_URL=sqlite:////app/backend/storage/satyacheck.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MASK_SENSITIVE_DATA=true
    volumes:
      - satyacheck_storage:/app/backend/storage

volumes:
  satyacheck_storage:
    driver: local
