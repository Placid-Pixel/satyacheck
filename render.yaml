services:
  - type: web
    name: satyacheck
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: MASK_SENSITIVE_DATA
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health
